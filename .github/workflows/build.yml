name: Build

on:
  push:
    branches: [master, main, 'modernize/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Build WinForms app (.NET Framework 4.8)
        shell: pwsh
        run: .\build.ps1 -Configuration Release

      - name: Build WPF app (net8.0-windows)
        run: dotnet build src-v2\RemoteAppTool.sln -c Release --nologo -v minimal
